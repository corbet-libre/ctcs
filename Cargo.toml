[package]
name = "ctcs"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
description = "Community-scoped contact relationship journal"
repository = "https://git.corbet.ch/corbet-libre/ctcs.git"
publish = false

[dependencies]
ckmg = { git = "https://git.corbet.ch/corbet-libre/ckmg.git", branch = "main" }
cwst = { git = "https://git.corbet.ch/corbet-libre/cwst.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[dev-dependencies]
futures = "0.3"
wasm-bindgen-test = "0.3"
ed25519-dalek = "3"
blake3 = "1"
rand_chacha = "0.10"
rand_core = "0.10"

[lints.rust]
unsafe_code = "forbid"
